<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>البحث</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#050506; --ink2:#0c0d0f; --steel:#8b9099; --silver:#e9ebee; --silver-dim:#a9adb4;
  --glass:rgba(255,255,255,.045); --edge:rgba(255,255,255,.12); --edge-hi:rgba(255,255,255,.34);
  --mx:50%; --my:50%;
}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#16181c 0%,var(--ink) 60%);color:var(--silver);
  font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(420px 420px at var(--mx) var(--my),rgba(220,225,232,.07),transparent 70%);transition:background .2s}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:clamp(18vh,26vh,30vh) 20px 80px}
.bar-wrap{position:relative;z-index:40;width:min(720px,100%);isolation:isolate}
.bar-wrap::before{content:"";position:absolute;inset:-26px;z-index:-1;border-radius:60px;
  background:radial-gradient(60% 100% at 50% 50%,rgba(210,216,224,.10),transparent 70%);filter:blur(22px);
  animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45;transform:scale(.97)}}
.bar{position:relative;display:flex;align-items:center;gap:6px;height:64px;padding:0 14px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.5),0 30px 60px -20px rgba(0,0,0,.8);
  transition:border-color .4s,box-shadow .4s}
.bar::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:radial-gradient(180px 90px at var(--bx,50%) var(--by,0%),rgba(255,255,255,.55),transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .4s}
.bar:hover::after,.bar:focus-within::after{opacity:1}
.bar:focus-within{border-color:var(--edge-hi);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.5),0 40px 80px -20px rgba(0,0,0,.9)}
.ico{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;
  color:var(--steel);cursor:pointer;transition:background .25s,color .25s,transform .25s,opacity .25s}
.ico:hover{background:rgba(255,255,255,.07);color:var(--silver)}
.ico:focus-visible{outline:1px solid var(--edge-hi);outline-offset:2px}
.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#q{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;color:var(--silver);font:300 17px/1 inherit;
  font-family:inherit;letter-spacing:.01em}
#q::placeholder{color:#6d727b}
#clear{opacity:0;transform:scale(.7);pointer-events:none}
.has-text #clear{opacity:1;transform:none;pointer-events:auto}
#go{background:linear-gradient(180deg,#f2f3f5,#b9bdc4);color:#0a0a0b;box-shadow:inset 0 1px 0 #fff,0 6px 16px -6px rgba(0,0,0,.7)}
#go:hover{background:linear-gradient(180deg,#fff,#c9cdd3);color:#000;transform:translateY(-1px)}
#fbtn{position:relative}
#fbtn .dot{position:absolute;top:8px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--silver);
  box-shadow:0 0 8px rgba(255,255,255,.7);transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
#fbtn.active{color:var(--silver)} #fbtn.active .dot{transform:scale(1)}
.menu{position:absolute;top:calc(100% + 12px);inset-inline-start:0;width:min(340px,100%);padding:14px;border-radius:26px;z-index:20;
  background:linear-gradient(180deg,#1c1e22,#0e0f11);max-height:min(70vh,560px);overflow:auto;
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 40px 70px -20px #000;
  opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top left;visibility:hidden;
  transition:opacity .28s,transform .35s cubic-bezier(.2,.9,.3,1),visibility 0s .35s}
.menu.open{opacity:1;transform:none;visibility:visible;transition:opacity .28s,transform .35s cubic-bezier(.2,.9,.3,1)}
.grp+.grp{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07)}
.grp h4{margin:0 4px 8px;font-size:12px;font-weight:400;color:var(--steel)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid transparent;background:rgba(255,255,255,.04);color:var(--silver-dim);font:400 13px inherit;font-family:inherit;
  padding:7px 13px;border-radius:999px;cursor:pointer;transition:all .22s}
.opt:hover{background:rgba(255,255,255,.09);color:var(--silver)}
.opt[aria-pressed=true]{color:#0a0a0b;background:linear-gradient(180deg,#f2f3f5,#bfc3ca);font-weight:500}
.opt:focus-visible{outline:1px solid var(--edge-hi);outline-offset:2px}
.row{display:flex;gap:10px}
.row label{flex:1;font-size:12px;color:var(--steel)}
.row input,.row select{width:100%;margin-top:6px;height:36px;padding:0 10px;border-radius:12px;color:var(--silver);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font:400 13px inherit;font-family:inherit;outline:0}
.row input:focus,.row select:focus{border-color:var(--edge-hi)}
.row select option{background:#111}
.hist{position:relative;z-index:1;width:min(720px,100%);margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hist .opt{font-size:12px}
/* results */
#out{position:relative;z-index:1;width:min(1100px,100%);margin-top:48px}
.sec{margin:0 4px 14px;font-weight:300;font-size:15px;color:var(--silver-dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px;margin-bottom:34px}
.card{position:relative;overflow:hidden;border-radius:20px;background:var(--glass);border:1px solid rgba(255,255,255,.08);
  transition:border-color .3s,transform .4s cubic-bezier(.2,.9,.3,1);animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card:hover{border-color:var(--edge-hi);transform:translateY(-3px)}
.thumb{aspect-ratio:3/4;background:linear-gradient(160deg,#17191d,#0b0c0e);display:grid;place-items:center;color:#3a3e45;overflow:hidden}
.card.scene .thumb{aspect-ratio:16/10}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.2}
.meta{padding:11px 13px 13px}
.meta b{display:block;font-weight:400;font-size:13.5px;line-height:1.5;color:var(--silver);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta small{display:block;margin-top:4px;font-size:12px;color:var(--steel)}
.card.scene{grid-column:span 2}
@media(max-width:520px){.card.scene{grid-column:span 1}}
.msg{text-align:center;color:var(--steel);font-size:14px;padding:26px 0}
.msg button{margin-top:12px}
.sentinel{height:1px}
.spin{width:22px;height:22px;margin:24px auto;border-radius:50%;border:1.5px solid rgba(255,255,255,.12);border-top-color:var(--silver);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px;margin-bottom:38px}
.pcard{cursor:pointer;text-align:center;padding:18px 10px 14px;border-radius:24px;background:var(--glass);border:1px solid rgba(255,255,255,.08);
  transition:border-color .3s,transform .4s cubic-bezier(.2,.9,.3,1);animation:in .5s both;outline:0}
.pcard:hover,.pcard:focus-visible{border-color:var(--edge-hi);transform:translateY(-3px)}
.pcard b{display:block;font-weight:400;font-size:13.5px;line-height:1.5}
.pcard small{display:block;margin-top:2px;font-size:11.5px;color:var(--steel)}
.av{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#3a3e45;
  background:linear-gradient(160deg,#17191d,#0b0c0e);border:1px solid rgba(255,255,255,.1)}
.av img{width:100%;height:100%;object-fit:cover;display:block}.av svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.2}
.card{cursor:pointer;outline:0}.card:focus-visible{border-color:var(--edge-hi)}
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(3,3,4,.74);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
#modal.open{opacity:1;visibility:visible;transition:opacity .3s}
.sheet{position:relative;width:min(920px,100%);max-height:92vh;overflow:auto;border-radius:30px;overscroll-behavior:contain;
  background:linear-gradient(180deg,rgba(30,32,36,.94),rgba(10,11,13,.97));border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 50px 100px -20px #000;transform:translateY(16px) scale(.98);
  transition:transform .4s cubic-bezier(.2,.9,.3,1)}
#modal.open .sheet{transform:none}
.sheet-top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;padding:12px 14px;height:64px;margin-bottom:-64px;pointer-events:none}
.sheet-top .ico{pointer-events:auto;background:rgba(8,9,10,.72);backdrop-filter:blur(10px);border:1px solid var(--edge)}
.player{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.sbody{padding:24px 28px 32px}
.sbody h2{margin:0 0 8px;font-weight:400;font-size:25px;line-height:1.45}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:18px;color:var(--steel);font-size:13px}
.facts b{font-weight:400;color:var(--silver)}
.facts a{color:var(--silver);text-underline-offset:4px}
.desc{max-width:72ch;color:var(--silver-dim);font-weight:300;line-height:1.95;font-size:15px;margin:0 0 6px}
.sbody h4{margin:26px 0 12px;font-weight:400;font-size:13px;color:var(--steel)}
.plist{display:flex;flex-wrap:wrap;gap:12px}
.pchip{width:92px;padding:6px 2px;text-align:center;background:none;border:0;border-radius:18px;color:var(--silver);font:400 12.5px/1.5 inherit;font-family:inherit;cursor:pointer;transition:background .25s}
.pchip:hover,.pchip:focus-visible{background:rgba(255,255,255,.06);outline:0}
.pchip .av{width:72px;height:72px;margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.phead{display:flex;gap:22px;align-items:center;padding:60px 28px 0}
.phead .av{width:116px;height:116px;margin:0;flex:none}
.phead h2{margin:0 0 6px;font-weight:400;font-size:26px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}
.kv div{padding:10px 13px;border-radius:15px;background:rgba(255,255,255,.04)}
.kv span{display:block;font-size:11.5px;color:var(--steel)}.kv b{font-weight:400;font-size:13.5px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.strip .thumb{flex:none;width:104px;aspect-ratio:3/4;border-radius:14px}
@media(max-width:560px){.phead{flex-direction:column;align-items:flex-start}.sbody{padding:20px 18px 26px}}
.logo{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;overflow:hidden;font-size:18px;color:var(--silver);
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--edge)}
.logo img{width:100%;height:100%;object-fit:contain;padding:7px;display:block}
.logo.sm{width:20px;height:20px;border-radius:6px;font-size:11px}.logo.sm img{padding:2px}
.srcline{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12.5px;color:var(--silver-dim)}
.srcbox{display:flex;align-items:center;gap:13px;margin:6px 0 18px}
.srcbox b{display:block;font-weight:500;font-size:15.5px}.srcbox small{display:block;margin-top:3px;color:var(--steel);font-size:12.5px}
.links{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0 0 14px;font-size:13px}
.links a{color:var(--silver-dim);text-underline-offset:4px}.links a:hover{color:var(--silver)}
.nopv{position:relative;aspect-ratio:16/9;background:#000;display:grid;place-items:center;overflow:hidden}
.nopv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.nopv span{position:relative;max-width:80%;text-align:center;font-size:13.5px;color:var(--silver-dim);padding:9px 18px;border-radius:999px;background:rgba(8,9,10,.72);border:1px solid var(--edge)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<main class="stage">
  <div class="bar-wrap" id="wrap">

<script>
/* ============ CONFIG ============ */
const TOKEN = "anB4dGD3YVJ2pAVQhlmHpTE1qDMSfxlA0JYF9KOHfc6e8cac"; // مفتاح الـ API
const BASE = "https://api.theporndb.net";

  ["Vixen",["vixen"]],["BLACKED",["blacked"]],["BLACKEDraw",["blacked raw","blackedraw"]],
  ["TUSHY",["tushy"]],["TUSHY Raw",["tushy raw","tushyraw"]],["DEEPER",["deeper"]],
  ["Slayed",["slayed"]],["Milfy",["milfy"]],["Taboo Heat",["taboo heat","tabooheat"]]

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const load = (k,d) => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d }catch{ return d } };
const save = (k,v) => { try{ localStorage.setItem(k,JSON.stringify(v)) }catch{} };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r=>setTimeout(r,ms));

const settings = Object.assign({type:"all",sort:"relevance",studio:"",year:"",mins:"",nostudio:false}, load("pf_settings",{}));
let history = load("pf_history",[]);

function normUrl(u){
  if(typeof u!=="string") return "";
  u=u.trim();
  if(u.startsWith("//")) return "https:"+u;
  if(u.startsWith("http://")) return "https://"+u.slice(7);
  if(u.startsWith("https://")) return u;
  if(u.startsWith("/")) return BASE+u;
  return "";
}
function pickImg(v){
  if(!v) return "";
  if(typeof v==="string") return normUrl(v);
  if(Array.isArray(v)){ for(const x of v){ const r=pickImg(x); if(r) return r } return ""; }
  if(typeof v==="object"){ for(const k of ["large","medium","full","small","url","src"]){ const r=pickImg(v[k]); if(r) return r } }
  return "";
}
const firstImg = (...c) => { for(const x of c){ const r=pickImg(x); if(r) return r } return ""; };

function normScene(s){
  const date=s.date||"";
  return { id:String(s.id), title:s.title||"", date, year:date.slice(0,4),
    mins:s.duration?Math.round(s.duration/60):0, desc:s.description, url:s.url, director:s.director, trailer:pickImg(s.trailer)||pickImg(s.preview)||pickImg(s.video),
    tags:(s.tags||[]).map(t=>t.name),
    img:firstImg(s.poster,s.image,s.background&&s.background.large,s.background&&s.background.medium,s.background&&s.background.full,s.background&&s.background.small),
    bg:pickImg(s.background&&s.background.large),
    studio:s.site?{id:String(s.site.id),name:s.site.name||s.site.short_name,logo:pickImg(s.site.logo)||pickImg(s.site.favicon),parent_id:s.site.parent_id==null?null:String(s.site.parent_id)}:null,
    perfs:(s.performers||[]).map(p=>({id:String(p.id),name:p.name||(p.parent&&p.parent.name),img:firstImg(p.image,p.thumbnail,p.face)})) };
}
function normPerf(p){
  return { id:String(p.id), name:p.name||"", img:firstImg(p.image,p.thumbnail,p.poster,p.face),
    aliases:(p.aliases||[]).map(a=>typeof a==="string"?a:a.name), bio:p.bio, extras:p.extras||{},
    gallery:(p.posters||[]).map(pickImg).filter(Boolean) };
}

class ApiError extends Error{ constructor(kind,msg){ super(msg); this.kind=kind } }

      const wait=Math.min(parseInt(res.headers.get("Retry-After")||"2",10)||2,30);
      await sleep(wait*1000);
      return api(path,params,signal,true);

    return d;

    throw new ApiError("net","تعذّر الاتصال بالخادم. تحقق من الشبكة أو إعدادات CORS.");
  }finally{
    clearTimeout(timer); signal && signal.removeEventListener("abort",onAbort);
  }
}
const hasMore = r => r.meta ? r.meta.current_page<r.meta.last_page : !!(r.links&&r.links.next);

/* ---- studios (resolved dynamically, never hardcoded) ---- */
let studioMap = null; // {Name:{ids:[...]}}
async function resolveStudios(signal){
  if(studioMap) return studioMap;
  const c = load("pf_studios",null);
  if(c && Date.now()-c.t<7*864e5){ studioMap=c.map; return studioMap; }
  const map = {};
  await Promise.all(CATALOG.map(async ([name,aliases])=>{
    const want = new Set(aliases.map(norm));
    try{
      const r = await api("/sites",{q:name,per_page:25},signal);
      const list = r.data||[];
      const exact = list.filter(x=>[x.name,x.short_name,x.slug].some(v=>v&&want.has(norm(v))));
      const ids = exact.map(x=>String(x.id));
      const kids = list.filter(x=>x.parent_id!=null && ids.includes(String(x.parent_id))).map(x=>String(x.id));
      const all=[...new Set([...ids,...kids])];
      if(all.length) map[name]={ids:all};
    }catch(e){ if(e.kind==="auth") throw e; }
  }));
  studioMap=map; save("pf_studios",{t:Date.now(),map});
  return map;
}
const allowedSet = () => {
  if(!settings.studio || !studioMap || !studioMap[settings.studio]) return null;
  return new Set(studioMap[settings.studio].ids);
};
const studioOk = (s,set) => !set || (s.studio && (set.has(s.studio.id) || (s.studio.parent_id && set.has(s.studio.parent_id))));

/* ---- search state ---- */
const S = { q:"", scenes:[], perfs:[], sPage:0, pPage:0, sMore:false, pMore:false, busy:false, seenS:new Set(), seenP:new Set(), gen:0 };

async function fetchScenes(page,signal){
  const set = allowedSet();
  if(settings.studio && !set) return {items:[],more:false};
  let raw=[], more=false;
  if(!set){
    const r = await api("/scenes",{q:S.q,page,per_page:PER},signal);
    raw=(r.data||[]); more=hasMore(r);
  }else{
    const rs = await Promise.all([...set].map(id=>api("/scenes",{q:S.q,page,per_page:PER,site_id:id},signal).catch(e=>{ if(e.kind==="auth") throw e; return {data:[]} })));
    raw=rs.flatMap(r=>r.data||[]); more=rs.some(hasMore);
  }
  let items = raw.map(normScene);
  items = items.filter(s=>studioOk(s,set));
  if(settings.nostudio) items = items.filter(s=>s.studio);
  return {items,more};
}
async function fetchPerfs(page,signal){
  const r = await api("/performers",{q:S.q,page,per_page:PER},signal);
  return {items:(r.data||[]).map(normPerf),more:hasMore(r)};
}

async function runSearch(){
  S.q = $("#q").value.trim();
  ctrl && ctrl.abort(); ctrl = new AbortController();
  const gen=++S.gen, sig=ctrl.signal;
  Object.assign(S,{scenes:[],perfs:[],sPage:0,pPage:0,sMore:false,pMore:false,seenS:new Set(),seenP:new Set(),busy:false});
  $("#out").innerHTML=""; 
  if(!S.q && !settings.studio){ return; }
  if(S.q){ history=[S.q,...history.filter(h=>h!==S.q)].slice(0,8); save("pf_history",history); renderHist(); }
  await loadMore(gen,sig,true);
}
async function loadMore(gen,sig,first){
  if(S.busy) return; S.busy=true; showSpinner();
  try{
    if(settings.studio) await resolveStudios(sig);
    const wantS = settings.type!=="performers", wantP = settings.type!=="scenes";
    const jobs=[];
    if(wantS && (first||S.sMore)) jobs.push(fetchScenes(S.sPage+1,sig).then(r=>({k:"s",r})));
    if(wantP && S.q && (first||S.pMore)) jobs.push(fetchPerfs(S.pPage+1,sig).then(r=>({k:"p",r})));
    const res = await Promise.allSettled(jobs);
    if(gen!==S.gen) return;
    let firstErr=null;
    for(const x of res){
      if(x.status==="rejected"){ firstErr=firstErr||x.reason; continue; }
      const {k,r}=x.value;
      if(k==="s"){ S.sPage++; S.sMore=r.more; r.items.forEach(i=>{ if(!S.seenS.has(i.id)){S.seenS.add(i.id);S.scenes.push(i)} }); }
      else{ S.pPage++; S.pMore=r.more; r.items.forEach(i=>{ if(!S.seenP.has(i.id)){S.seenP.add(i.id);S.perfs.push(i)} }); }
    }
    // client-side filtered pages can come back sparse: keep pulling a few pages
    if(!firstErr && settings.studio && S.sMore && S.scenes.length<12 && S.sPage<4){ S.busy=false; return loadMore(gen,sig,false); }
    render(firstErr);
  }catch(e){
    if(gen===S.gen && !(sig.aborted)) render(e);
  }finally{ if(gen===S.gen) S.busy=false; }
}
/* ============ RENDER ============ */
const PH = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>';
const thumb = img => `<div class="thumb">${img?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(img)}" alt="">`:PH}</div>`;

function sortScenes(a){
  const l=[...a];
  if(settings.sort==="newest") l.sort((x,y)=>(y.date||"").localeCompare(x.date||""));
  else if(settings.sort==="oldest") l.sort((x,y)=>(x.date||"9").localeCompare(y.date||"9"));
  else if(settings.sort==="az") l.sort((x,y)=>x.title.localeCompare(y.title,"en"));
  return l;
}
const REG={s:new Map(),p:new Map()};
const meta1=a=>a.filter(Boolean).map(esc).join(" ، ");
const logoEl=(st,sz)=>{ const c=esc((st.name||"?").trim().charAt(0));
  return `<span class="logo ${sz||""}" data-i="${c}">${st.logo?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(st.logo)}" alt="">`:c}</span>`; };
function sceneCard(s,i){
  REG.s.set(s.id,s); const st=s.studio;
  return `<div class="card scene" tabindex="0" role="button" data-sid="${esc(s.id)}" style="animation-delay:${Math.min(i,12)*30}ms">${thumb(s.img)}
    <div class="meta"><b>${esc(s.title)}</b>${st?`<span class="srcline">${logoEl(st,"sm")}<span>${esc(st.name)}</span></span>`:""}
    <small>${meta1([s.date||s.year,s.mins?s.mins+" د":""])}</small></div></div>`;
}
function perfCard(p,i){
  REG.p.set(p.id,p);
  return `<div class="pcard" tabindex="0" role="button" data-pid="${esc(p.id)}" style="animation-delay:${Math.min(i,12)*30}ms">
    <div class="av">${p.img?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(p.img)}" alt="">`:PH}</div>
    <b>${esc(p.name)}</b><small>${esc((p.extras&&p.extras.nationality)||p.aliases[0]||"")}</small></div>`;
}
function render(err){
  const out=$("#out"); let h="";
  const yr=settings.year.trim(), mn=parseInt(settings.mins,10)||0;
  const sc=sortScenes(S.scenes.filter(s=>(!yr||s.year===yr)&&(!mn||s.mins>=mn)));
  const showP = S.perfs.length && settings.type!=="scenes";
  if(showP) h+=`<h3 class="sec">الأداء</h3><div class="pgrid">${S.perfs.map(perfCard).join("")}</div>`;
  if(sc.length) h+=`<h3 class="sec">المشاهد</h3><div class="grid">${sc.map(sceneCard).join("")}</div>`;
  if(!sc.length && !showP && !err) h=`<p class="msg">لا توجد نتائج مطابقة. جرّب كلمات أخرى أو خفّف الفلاتر.</p>`;
  if(err) h+=`<div class="msg">${esc(err.message||"حدث خطأ غير متوقع")}<br><button class="opt" id="retry">إعادة المحاولة</button></div>`;
  h+=`<div class="sentinel" id="sent"></div>`;
  out.innerHTML=h;
  const r=$("#retry"); if(r) r.onclick=()=>{ S.busy=false; const g=++S.gen; ctrl=new AbortController(); loadMore(g,ctrl.signal,!S.sPage&&!S.pPage); };
  if(!err && (S.sMore||S.pMore)) io.observe($("#sent"));
}
document.addEventListener("error",e=>{
  const i=e.target; if(!i||!i.tagName) return;
  if(i.tagName==="VIDEO"){ const n=document.createElement("div"); n.className="nopv";
    n.innerHTML='<span>تعذّر تشغيل العرض هنا (قد يمنعه المصدر). افتحه من الرابط في نافذة جديدة.</span>'; i.replaceWith(n); return; }
  if(i.tagName!=="IMG") return;
  if(i.closest(".nopv")){ i.remove(); return; }
  const w=i.closest(".thumb,.av,.logo"); if(!w) return;
  if(w.classList.contains("logo")) w.textContent=w.dataset.i||""; else { i.remove(); w.innerHTML=PH; }
},true);
function showSpinner(){ const o=$("#out"); const s=o.querySelector(".sentinel"); if(s) s.remove(); o.insertAdjacentHTML("beforeend",'<div class="spin"></div>'); }
const io = new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting) && !S.busy){ io.disconnect(); loadMore(S.gen,ctrl.signal,false); } },{rootMargin:"400px"});

/* ============ UI ============ */
const q=$("#q"), bar=$("#bar"), menu=$("#menu"), fbtn=$("#fbtn");
const syncClear=()=>bar.classList.toggle("has-text",!!q.value);
let deb; const debounced=()=>{ clearTimeout(deb); deb=setTimeout(runSearch,DEBOUNCE) };
q.addEventListener("input",()=>{ syncClear(); debounced(); });
q.addEventListener("keydown",e=>{ if(e.key==="Enter"){ clearTimeout(deb); runSearch(); } if(e.key==="Escape") closeMenu(); });
$("#go").onclick=()=>{ clearTimeout(deb); runSearch(); };
$("#clear").onclick=()=>{ q.value=""; syncClear(); q.focus(); clearTimeout(deb); runSearch(); };

function openMenu(){ menu.classList.add("open"); fbtn.setAttribute("aria-expanded","true"); resolveStudios(new AbortController().signal).then(buildStudios).catch(()=>{}); }
function closeMenu(){ menu.classList.remove("open"); fbtn.setAttribute("aria-expanded","false"); }
fbtn.onclick=e=>{ e.stopPropagation(); menu.classList.contains("open")?closeMenu():openMenu(); };
document.addEventListener("click",e=>{ if(!menu.contains(e.target)) closeMenu(); });

function buildStudios(){
  const box=$("#studios");
  const names=Object.keys(studioMap||{});
  box.innerHTML=`<button class="opt" data-v="">الكل</button>`+names.map(n=>`<button class="opt" data-v="${esc(n)}">${esc(n)}</button>`).join("");
  syncOpts();
}
function syncOpts(){
  document.querySelectorAll(".opts").forEach(g=>g.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed",String(settings[g.dataset.key]===b.dataset.v))));
  $("#year").value=settings.year; $("#mins").value=settings.mins;
  $("#nostudio").setAttribute("aria-pressed",String(settings.nostudio));
  const act = settings.type!=="all"||settings.sort!=="relevance"||settings.studio||settings.year||settings.mins||settings.nostudio;
  fbtn.classList.toggle("active",!!act);
  save("pf_settings",settings);
}
menu.addEventListener("click",e=>{
  const b=e.target.closest(".opt"); if(!b) return;
  const g=b.closest(".opts");
  if(g){ settings[g.dataset.key]=b.dataset.v; syncOpts(); (g.dataset.key==="sort")?render():runSearch(); }
  else if(b.id==="nostudio"){ settings.nostudio=!settings.nostudio; syncOpts(); runSearch(); }
  else if(b.id==="reset"){ Object.assign(settings,{type:"all",sort:"relevance",studio:"",year:"",mins:"",nostudio:false}); syncOpts(); runSearch(); }
});
["year","mins"].forEach(id=>$("#"+id).addEventListener("input",e=>{ settings[id]=e.target.value.replace(/\D/g,""); e.target.value=settings[id]; syncOpts(); render(); }));

function renderHist(){
  $("#hist").innerHTML=history.slice(0,6).map(h=>`<button class="opt">${esc(h)}</button>`).join("");
}
$("#hist").addEventListener("click",e=>{ const b=e.target.closest(".opt"); if(!b) return; q.value=b.textContent; syncClear(); runSearch(); });

/* ============ DETAIL VIEWS ============ */
const modal=$("#modal"), sheet=$("#sheet"), stack=[]; let mctrl=null, film=null;
const LBL={gender:"الجنس",birthday:"تاريخ الميلاد",birthplace:"مكان الميلاد",nationality:"الجنسية",ethnicity:"العرق",hair_colour:"لون الشعر",eye_colour:"لون العيون",height:"الطول",weight:"الوزن",measurements:"القياسات",cupsize:"الكأس",tattoos:"الوشوم",piercings:"الثقوب",career_start_year:"بداية المسيرة",career_end_year:"نهاية المسيرة",fake_boobs:"عمليات تجميل",habits:"عادات",astrology:"البرج"};
const ICO_BACK='<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>', ICO_X='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const topbar=()=>`<div class="sheet-top"><button class="ico" data-a="back" aria-label="رجوع" ${stack.length>1?"":'style="visibility:hidden"'}>${ICO_BACK}</button><button class="ico" data-a="close" aria-label="إغلاق">${ICO_X}</button></div>`;
const avatar=(src)=>`<div class="av">${src?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(src)}" alt="">`:PH}</div>`;

function mOpen(v){ stack.push(v); mShow(); }
function mBack(){ if(stack.length>1){ stack.pop(); mShow(); } }
function mClose(){
  modal.classList.remove("open"); stack.length=0; mctrl&&mctrl.abort(); film=null; document.body.style.overflow="";
  sheet.querySelectorAll("iframe,video").forEach(x=>x.remove());
  setTimeout(()=>{ if(!modal.classList.contains("open")) sheet.innerHTML=""; },350);
}
function mShow(){
  const v=stack[stack.length-1]; mctrl&&mctrl.abort(); mctrl=new AbortController();
  modal.classList.add("open"); document.body.style.overflow="hidden"; sheet.scrollTop=0;
  sheet.innerHTML=topbar()+'<div class="spin" style="margin-top:90px;margin-bottom:90px"></div>';
  (v.type==="scene"?showScene:showPerf)(v,mctrl.signal);
}
function trailerEl(s){
  const poster=s.bg||s.img;
  return poster?`<div class="thumb" style="aspect-ratio:16/9;border-radius:0"><img referrerpolicy="no-referrer" src="${esc(poster)}" alt=""></div>`:'<div style="height:64px"></div>';
}
async function showScene(v,sig){
  let s=v.data;
  try{ s=normScene((await api("/scenes/"+v.id,{},sig)).data); }
  catch(e){ if(sig.aborted) return; if(!s){ sheet.innerHTML=topbar()+`<p class="msg" style="padding:80px 20px">${esc(e.message)}</p>`; return; } }
  if(sig.aborted) return;
  s.perfs.forEach(p=>{ if(!REG.p.has(p.id)) REG.p.set(p.id,{id:p.id,name:p.name,img:p.img,aliases:[],extras:{},gallery:[]}); });
  const st=s.studio, link=normUrl(s.url);
  const more=[s.mins&&`المدة: <b>${s.mins} دقيقة</b>`,s.director&&`المخرج: <b>${esc(s.director)}</b>`].filter(Boolean).map(x=>`<span>${x}</span>`).join("");
  sheet.innerHTML=topbar()+trailerEl(s)+`<div class="sbody"><h2>${esc(s.title)}</h2>
    <div class="srcbox">${st?logoEl(st):""}<div><b>${esc(st?st.name:"مصدر غير معروف")}</b><small>${esc(s.date||"")}</small></div></div>
    ${more?`<div class="facts">${more}</div>`:""}
    <div class="links">${link?`<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">فتح في الموقع الأصلي</a>`:""}</div>
    ${s.desc?`<p class="desc">${esc(s.desc)}</p>`:""}
    ${s.perfs.length?`<h4>الأداء</h4><div class="plist">${s.perfs.map(p=>`<button class="pchip" data-pid="${esc(p.id)}">${avatar(p.img)}<span>${esc(p.name)}</span></button>`).join("")}</div>`:""}
    ${s.tags.length?`<h4>الوسوم</h4><div class="tags">${s.tags.map(t=>`<button class="opt" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</div>`:""}</div>`;
}
function ageOf(b){
  const d=new Date(b); if(!b||isNaN(d)) return null; const n=new Date();
  let a=n.getFullYear()-d.getFullYear(); const m=n.getMonth()-d.getMonth();
  if(m<0||(m===0&&n.getDate()<d.getDate())) a--; return a>=0&&a<120?a:null;
}
async function filmPage(F,page,sig){
  const mine=x=>(x.performers||[]).some(p=>String(p.id)===F.id||String(p.parent&&p.parent.id)===F.id||(F.name&&norm(p.name||(p.parent&&p.parent.name))===norm(F.name)));
  const tries=[
    async()=>api(`/performers/${F.id}/scenes`,{page},sig),
    async()=>{ const r=await api("/scenes",{performer_id:F.id,page,per_page:PER},sig); return {...r,data:(r.data||[]).filter(mine)}; },
    async()=>{ const r=await api("/scenes",{q:F.name,page,per_page:PER},sig); return {...r,data:(r.data||[]).filter(mine)}; }
  ];
  for(let i=F.mode;i<tries.length;i++){
    try{
      const r=await tries[i]();
      if(page===1 && !(r.data||[]).length && i<tries.length-1) continue;
      F.mode=i; return r;
    }catch(e){
      if(sig.aborted||["auth","timeout","net","rate"].includes(e.kind)||i===tries.length-1) throw e;
    }
  }
  return {data:[]};
}
async function showPerf(v,sig){
  let p=v.data;
  try{ p=normPerf((await api("/performers/"+v.id,{},sig)).data); }
  catch(e){ if(sig.aborted) return; if(!p){ sheet.innerHTML=topbar()+`<p class="msg" style="padding:80px 20px">${esc(e.message)}</p>`; return; } }
  if(sig.aborted) return;
  const ex=p.extras||{}, age=ageOf(ex.birthday);
  const rows=Object.entries(ex).filter(([k,x])=>["string","number","boolean"].includes(typeof x)&&String(x).trim()!=="")
    .map(([k,x])=>`<div><span>${esc(LBL[k]||k.replace(/_/g," "))}</span><b>${esc(typeof x==="boolean"?(x?"نعم":"لا"):x)}</b></div>`);
  if(age!=null) rows.unshift(`<div><span>العمر</span><b>${age}</b></div>`);
  sheet.innerHTML=topbar()+`<div class="phead">${avatar(p.img)}<div><h2>${esc(p.name)}</h2>
    ${p.aliases.length?`<div class="facts" style="margin:0">${esc(p.aliases.slice(0,5).join(" ، "))}</div>`:""}</div></div>
    <div class="sbody">${rows.length?`<div class="kv">${rows.join("")}</div>`:""}
    ${p.bio?`<h4>نبذة</h4><p class="desc">${esc(p.bio)}</p>`:""}
    ${p.gallery.length?`<h4>الصور</h4><div class="strip">${p.gallery.slice(0,10).map(g=>`<div class="thumb"><img loading="lazy" referrerpolicy="no-referrer" src="${esc(g)}" alt=""></div>`).join("")}</div>`:""}
    <h4>الأعمال</h4><div class="grid" id="film"></div><div id="filmstat"></div></div>`;
  film={id:v.id,name:p.name,mode:0,scenes:[],seen:new Set(),page:0,more:true,busy:false,err:null,shown:0,sig};
  loadFilm();
}
async function loadFilm(){
  const F=film; if(!F||F.busy||!F.more) return; F.busy=true; F.err=null; renderFilm();
  try{
    if(settings.studio) await resolveStudios(F.sig);
    const set=allowedSet(); let tries=0, got=0;
    while(F.more && tries<4 && got<12){
      const r=await filmPage(F,F.page+1,F.sig); F.page++; F.more=hasMore(r); tries++;
      (r.data||[]).map(normScene).filter(x=>studioOk(x,set)&&(!settings.nostudio||x.studio)).forEach(x=>{ if(!F.seen.has(x.id)){F.seen.add(x.id);F.scenes.push(x);got++} });
      if(F.mode===0&&!set&&!settings.nostudio) break;
    }
  }catch(e){ if(F.sig.aborted) return; F.err=e; }
  F.busy=false; if(film===F) renderFilm();
}
const io2=new IntersectionObserver(es=>{ if(film&&es.some(e=>e.isIntersecting)){ io2.disconnect(); loadFilm(); } },{root:sheet,rootMargin:"300px"});
function renderFilm(){
  const F=film, box=$("#film"); if(!F||!box) return;
  box.insertAdjacentHTML("beforeend",F.scenes.slice(F.shown).map((x,i)=>sceneCard(x,i)).join("")); F.shown=F.scenes.length;
  $("#filmstat").innerHTML=(F.busy?'<div class="spin"></div>':"")
    +(F.err?`<div class="msg">${esc(F.err.message)}<br><button class="opt" id="fretry">إعادة المحاولة</button></div>`:"")
    +(!F.busy&&!F.err&&!F.scenes.length&&!F.more?'<p class="msg">لا توجد أعمال مطابقة.</p>':"")
    +(F.more&&!F.busy&&!F.err?'<div id="fsent" style="height:1px"></div>':"");
  const f=$("#fsent"); if(f) io2.observe(f);
}
function act(el){
  const a=el.closest("[data-a],[data-sid],[data-pid],[data-tag]"); if(!a) return false; const d=a.dataset;
  if(d.a==="close") mClose(); else if(d.a==="back") mBack();
  else if(d.sid) mOpen({type:"scene",id:d.sid,data:REG.s.get(d.sid)});
  else if(d.pid) mOpen({type:"perf",id:d.pid,data:REG.p.get(d.pid)});
  else if(d.tag){ mClose(); q.value=d.tag; syncClear(); scrollTo({top:0,behavior:"smooth"}); runSearch(); }
  return true;
}
document.addEventListener("click",e=>{
  if(e.target===modal){ mClose(); return; }
  if(e.target.closest("#fretry")&&film){ loadFilm(); return; }
  act(e.target);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&modal.classList.contains("open")) mClose();
  if(e.key==="Enter"&&e.target.matches&&e.target.matches(".card[data-sid],.pcard[data-pid]")) act(e.target);
});

/* ambient light follows the pointer */
const root=document.documentElement;
addEventListener("pointermove",e=>{ root.style.setProperty("--mx",e.clientX+"px"); root.style.setProperty("--my",e.clientY+"px"); },{passive:true});
bar.addEventListener("pointermove",e=>{ const r=bar.getBoundingClientRect(); bar.style.setProperty("--bx",(e.clientX-r.left)+"px"); bar.style.setProperty("--by",(e.clientY-r.top)+"px"); });

syncOpts(); renderHist();
</script>
